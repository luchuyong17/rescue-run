<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>救援行動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(36,30,28,.84);
  --panel-edge: rgba(243,233,216,.16);
  --ink:#f3e9d8; --ink-dim:#bdb09e; --accent:#e8b04a; --ok:#9cc46f; --bad:#e0664b;
  --bg:#3a3450;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#2e2a42; } }
:root[data-theme="dark"]{ --bg:#2e2a42; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);
  background-image:linear-gradient(180deg,#34304b 0%,#5e4a63 38%,#a8706a 72%,#dfa06c 100%);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;
}
#stage{position:fixed;inset:0;}
canvas{display:block;}
button{font:inherit;color:inherit;}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px;}

.hud{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--panel-edge);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.hud-left{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:min(290px,calc(100vw - 24px));padding:12px 14px;}
.mission{font-weight:500;font-size:15px;line-height:1.45;margin-bottom:10px;}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-dim);margin-top:6px;}
.row .lbl{width:4.6em;flex:none;}
.row strong{color:var(--ink);font-weight:500;}
.bars{display:flex;align-items:flex-end;gap:3px;height:16px;}
.bars i{display:block;width:6px;background:rgba(243,233,216,.18);border-radius:2px;}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:13px}.bars i:nth-child(5){height:16px}
.bars i.on{background:var(--accent);}
.meter{flex:1;height:8px;border-radius:4px;background:rgba(243,233,216,.14);overflow:hidden;}
.meter b{display:block;height:100%;width:100%;background:var(--ok);transition:width .2s linear,background .3s;}

.hud-right{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.tog{display:flex;align-items:center;gap:10px;min-width:138px;padding:7px 10px;background:rgba(243,233,216,.05);border:1px solid rgba(243,233,216,.12);border-radius:8px;font-size:14px;cursor:pointer;text-align:left;}
.tog span{flex:1;}
.tog em{font-style:normal;font-size:12px;color:var(--ink-dim);}
.tog kbd{font-family:inherit;font-size:11px;color:var(--ink-dim);border:1px solid rgba(243,233,216,.2);border-radius:4px;padding:0 5px;}
.tog.on{border-color:var(--accent);background:rgba(232,176,74,.18);}
.tog.on em{color:var(--accent);}
.tog.dim{opacity:.45;}

.garage{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:12px;width:min(330px,calc(100vw - 24px));padding:14px 16px;}
.garage h2{margin:0 0 4px;font-size:16px;font-weight:700;}
.garage p{margin:0 0 10px;font-size:12.5px;line-height:1.55;color:var(--ink-dim);}
.mod{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(243,233,216,.1);cursor:pointer;}
.mod input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none;}
.mod strong{display:block;font-size:14px;font-weight:500;}
.mod small{display:block;font-size:12px;line-height:1.5;color:var(--ink-dim);margin-top:2px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(243,233,216,.1);}
.stats div{font-size:11.5px;color:var(--ink-dim);}
.stats b{display:block;font-size:15px;color:var(--ink);font-weight:500;margin-top:2px;}

.toast{position:fixed;left:50%;top:26%;transform:translate(-50%,6px);z-index:6;background:var(--panel);border:1px solid var(--panel-edge);border-radius:10px;padding:9px 16px;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:normal;max-width:calc(100vw - 32px);width:max-content;text-align:center;line-height:1.4;}   /* 長句在手機上換行，不超出螢幕 */
.toast.show{opacity:1;transform:translate(-50%,0);}

.keys{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);z-index:4;font-size:12px;color:rgba(243,233,216,.72);background:rgba(36,30,28,.5);padding:6px 12px;border-radius:8px;white-space:nowrap;}

.radio-sub{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);transform:translateX(-50%);z-index:20;width:min(680px,calc(100vw - 24px));text-align:center;background:rgba(18,14,12,.92);border:1px solid rgba(243,233,216,.28);border-radius:12px;padding:10px 18px 12px;pointer-events:none;transition:opacity .3s;box-shadow:0 4px 18px rgba(0,0,0,.45);}
.radio-sub small{display:block;font-size:11px;letter-spacing:.12em;color:var(--ink-dim);margin-bottom:3px;}
.radio-sub span{font-size:clamp(20px,3.2vw,28px);line-height:1.5;letter-spacing:.06em;font-weight:700;color:#fff6e4;}
.seg{display:flex;gap:4px;flex:1;}
.seg button{flex:1;padding:3px 0;font-size:12px;background:rgba(243,233,216,.06);border:1px solid rgba(243,233,216,.14);border-radius:6px;cursor:pointer;}
.seg button.on{background:rgba(232,176,74,.22);border-color:var(--accent);color:var(--accent);}
.mapcard{max-width:440px;}
.mapcv{display:block;width:100%;aspect-ratio:1;border-radius:10px;background:#57514f;margin:6px 0 10px;}
.compass{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:6;width:min(520px,calc(100vw - 660px));height:48px;pointer-events:none;}
@media (max-width:1180px){.compass{width:min(520px,calc(100vw - 24px));top:calc(env(safe-area-inset-top,0px) + 196px);}}
.tog .chip{display:block;width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.45);}
.clock{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.04em;margin-bottom:6px;}
.tstats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:6px 0 10px;}
.tstats div{font-size:13px;color:var(--ink-dim);}
.tstats b{display:block;font-size:20px;color:var(--ink);font-weight:700;margin-top:2px;}
.meter.big{height:12px;margin-bottom:8px;}
.go.alt{background:rgba(243,233,216,.12);color:var(--ink);border:1px solid var(--panel-edge);}
.go[disabled]{opacity:.45;cursor:default;}
.reslist{list-style:none;margin:6px 0 10px;padding:0;font-size:14px;}
.reslist li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(243,233,216,.08);}
.reslist li b{font-weight:700;}
.reslist li.total{border-bottom:0;font-size:17px;padding-top:8px;}
.sharetxt{white-space:pre-wrap;font:13px/1.6 inherit;font-family:inherit;background:rgba(243,233,216,.06);border-radius:10px;padding:10px 12px;margin:4px 0 14px;user-select:text;-webkit-user-select:text;}
#final .go.alt{margin-top:8px;}
#passRow .meter{height:12px;}
#passRow .lbl{font-weight:700;color:var(--ink);}
.seg3{display:flex;gap:8px;margin:4px 0 8px;}
.seg3 button{flex:1;padding:12px 4px;font-size:16px;font-weight:700;border-radius:10px;background:rgba(243,233,216,.08);border:1px solid var(--panel-edge);cursor:pointer;}
.seg3 button.on{background:var(--accent);color:#2a2018;border-color:var(--accent);}
.touch{display:none;}
.tpad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;display:flex;gap:10px;}
.tpad.l{left:14px;}
.tpad.r{right:14px;flex-direction:column;}
.tpad button{width:68px;height:62px;border-radius:14px;background:var(--panel);border:1px solid var(--panel-edge);font-size:15px;touch-action:none;}
.tpad.r button{width:84px;height:54px;}
.tpad button.held{background:rgba(232,176,74,.3);border-color:var(--accent);}
.mobonly{display:none;}
.menuwrap .morerow.mobonly,.menuwrap .sidebtn.mobonly{display:none;}
.menuwrap{display:contents;}
#vol{flex:1;min-width:0;accent-color:var(--accent);}
#volTxt{width:3em;text-align:right;font-size:12px;}
.gclose{display:block;width:100%;margin-top:10px;padding:9px;border-radius:8px;border:1px solid var(--panel-edge);background:rgba(243,233,216,.08);font-size:14px;}
@media (pointer:coarse){
  .keys{display:none;}
  .touch{display:block;}
}

/* ===== 手機版面（窄螢幕或觸控）：上方方位帶＋細列，右側中間功能鍵，下方左右按鈕，字幕在按鈕上方，中間 50% 留給遊戲畫面 ===== */
@media (max-width:640px),(pointer:coarse){
  .mobonly{display:block;}
  .compass{width:calc(100vw - 16px);height:40px;top:calc(env(safe-area-inset-top,0px) + 8px);}
  .hud-left{top:calc(env(safe-area-inset-top,0px) + 54px);left:8px;right:8px;width:auto;padding:5px 10px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;}
  .hud-left .mission{flex:1;min-width:0;margin:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hud-left .row{margin:0;font-size:12px;gap:6px;flex:none;}
  .hud-left .row .lbl{width:auto;}
  .hud-left #passRow .meter{width:60px;flex:none;}
  .hud-left .surfrow{display:none;}
  .menuwrap{display:none;}
  .menuwrap.open{display:block;position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);right:8px;z-index:30;background:var(--panel);border:1px solid var(--panel-edge);border-radius:10px;padding:6px 12px 10px;width:min(320px,calc(100vw - 16px));}
  .menuwrap .row{margin-top:8px;}
  .menuwrap .morerow.mobonly{display:flex;flex-wrap:wrap;gap:6px;}
  .menuwrap .sidebtn.mobonly{display:flex;}
  .menuwrap .morerow .tog{padding:6px 10px;font-size:13px;}
  #menuBtn{padding:2px 9px;border-radius:8px;border:1px solid rgba(243,233,216,.2);background:rgba(243,233,216,.06);font-size:16px;line-height:1.2;flex:none;}
  .hud-right{top:50%;bottom:auto;right:6px;transform:translateY(-50%);flex-direction:column;flex-wrap:nowrap;max-width:none;padding:4px;gap:4px;}
  .tog{min-width:0;padding:6px 7px;font-size:11.5px;gap:4px;justify-content:center;}
  .tog em,.tog kbd{display:none;}
  .garage{display:none;}
  .garage.open{display:block;position:fixed;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 24px));max-height:72vh;overflow:auto;z-index:30;}
  #garageBtn{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:6;padding:7px 14px;border-radius:10px;border:1px solid var(--accent);background:rgba(232,176,74,.2);font-size:14px;font-weight:700;}
  .radio-sub{bottom:calc(env(safe-area-inset-bottom,0px) + 46px);width:calc(100vw - 16px);}
  .radio-sub span{font-size:20px;}
}
/* 單手玩：右下（可換左下）一支虛擬搖桿，推上＝前進、拉下＝倒車、左右＝轉向，推多遠油門多大 */
.stick{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);right:18px;width:136px;height:136px;z-index:6;touch-action:none;}
.stick .base{position:absolute;inset:0;border-radius:50%;background:rgba(36,30,28,.55);border:2px solid rgba(243,233,216,.3);}
.stick .base::before,.stick .base::after{content:"";position:absolute;background:rgba(243,233,216,.18);}
.stick .base::before{left:50%;top:14%;bottom:14%;width:2px;}
.stick .base::after{top:50%;left:14%;right:14%;height:2px;}
.stick .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(232,176,74,.8);border:2px solid #f3e9d8;pointer-events:none;}

.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(28,22,30,.5);padding:20px;}
.overlay[hidden]{display:none;}
.card{max-width:440px;width:100%;background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:24px 24px 20px;}
.card h1{margin:0 0 10px;font-size:26px;font-weight:700;letter-spacing:.02em;}
.introcard.briefcard{min-height:0;}.briefcard .introtxt{flex:none;padding-top:6px;margin-bottom:26px;}   /* 提醒卡片：高度跟著內容，不用撐到開場那麼高 */
.introcard{min-height:480px;display:flex;flex-direction:column;}   /* 開場卡片：維持原本的大小，文字少了就放大、上下排開，「開始」留在底部 */
.card.introcard h1{font-size:30px;margin-bottom:18px;}
.introtxt{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:44px;gap:18px;}   /* 標題下空約兩行（Lu：原本置中空太多，縮一排） */
.introcard .introtxt p{margin:0;font-size:18px;line-height:1.65;}
.card h2{margin:0 0 8px;font-size:22px;font-weight:700;}
.card p{margin:0 0 12px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.card .dim{color:var(--ink-dim);font-size:13px;}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:4px 0 16px;font-size:13px;}
.card dt{color:var(--accent);font-weight:500;}
.card dd{margin:0;color:var(--ink-dim);}
.go{display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#2a2018;font-size:16px;font-weight:700;cursor:pointer;}
.go:hover{filter:brightness(1.06);}

/* ===== 手機第二版：單列頂欄、字幕有話才出現、功能鍵圍在搖桿上緣、浮動搖桿，把車前方的畫面空出來 ===== */
@media (max-width:640px),(pointer:coarse){
  .compass{left:80px;right:auto;width:calc(100vw - 160px);max-width:calc(100vw - 160px);transform:none;height:40px;top:calc(env(safe-area-inset-top,0px) + 8px);}   /* 頂部三格：左右都是 64 寬、間距都是 8，方位帶在中間 */
  .hud-left{-webkit-backdrop-filter:none;backdrop-filter:none;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:auto;width:64px;height:40px;padding:0 6px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;}
  .hud-left{flex-direction:column;gap:0;}
  .hud-left .clock{font-size:11px;margin:0;line-height:1.2;}
  .hud-left #radioRow{margin:0;}
  .go{padding:15px;font-size:18px;}
  .hud-left #radioRow .lbl,.hud-left #radioTxt{display:none;}
  .hud-left #passRow{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);left:8px;width:170px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:10px;padding:5px 10px;margin:0;}
  .hud-left .mission{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);left:8px;right:8px;flex:none;background:rgba(36,30,28,.9);border:1px solid var(--panel-edge);border-radius:10px;padding:6px 12px;opacity:0;pointer-events:none;transition:opacity .4s;white-space:normal;z-index:7;font-size:13px;}
  .hud-left .mission.show{opacity:1;}
  #menuBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;color:var(--ink);width:64px;height:40px;padding:0;z-index:7;background:var(--panel);border:1px solid var(--panel-edge);border-radius:12px;}
  .menuwrap.open{top:calc(env(safe-area-inset-top,0px) + 56px);}
  #garageBtn{top:28%;left:auto;right:8px;}
  .radio-sub{top:calc(env(safe-area-inset-top,0px) + 54px);bottom:auto;width:calc(100vw - 16px);padding:5px 12px;background:rgba(18,14,12,.74);border-radius:10px;box-shadow:none;border-color:rgba(243,233,216,.16);}
  .radio-sub small{display:none;}
  .radio-sub span{font-size:17px;font-weight:600;line-height:1.35;}
}
@media (max-width:640px),(pointer:coarse){
  body .stickzone{display:block;}   /* 前面加 body：蓋過檔案後面那條預設 display:none（之前就是被它蓋掉，觸發區根本沒出現） */
  body .stick{display:block;left:50%;right:auto;margin-left:-68px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);opacity:.32;transition:opacity .2s;pointer-events:none;}
  .stick.active{opacity:1;}
  /* 四顆功能鍵：搖桿左右各兩顆（搖桿預設在中下），不蓋到車 */
  .hud-right{position:fixed;top:auto;transform:none;right:auto;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:0;height:0;padding:0;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;display:block;z-index:8;}
  .hud-right .tog{position:absolute;top:-23px;width:46px;height:46px;min-width:0;padding:0;border-radius:50%;justify-content:center;font-size:11px;background:rgba(36,30,28,.8);border:1px solid var(--panel-edge);}
  .hud-right .tog span{flex:none;}
  .hud-right .tog.on{background:rgba(232,176,74,.6);border-color:var(--accent);color:#fff;}
  .hud-right .tog:nth-child(1){left:-171px;}
  .hud-right .tog:nth-child(2){left:-121px;}
  .hud-right .tog:nth-child(3){left:75px;}
  .hud-right .tog:nth-child(4){left:125px;}
  .hud-right .mode{flex-direction:column;gap:2px;}
  .hud-right .mode .chip{width:9px;height:9px;}
  .hud-right .mode kbd{display:none;}
  #tScout{left:-146px;top:-76px;}   /* 和絞盤左右對稱：放在低速檔和洩氣上方 */
  #tScout em{display:none;}
  #tTow{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);right:8px;left:auto;width:64px;height:40px;border-radius:12px;margin:0;z-index:8;}
  #tMap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 138px);right:8px;left:auto;width:64px;height:40px;border-radius:12px;margin:0;z-index:8;}   /* 地圖鈕：拖車鈕下面，同樣的圓角方形 */   /* 圓角方形，和頂部那排一致 */   /* 右上方，離勘查、選單鈕 ≥28 px、離下方的模式鍵很遠，避免誤觸 */
  #tTow,#tMap{flex-direction:row;gap:5px;}   /* 右上的方形鈕：小點放在文字左邊（上下疊會擠出按鈕外） */
  #tWinch{left:100px;top:-76px;}   /* 第五顆圓鈕：放在差速鎖和升高上方，樣式和模式鍵一樣 */
}
#tTow{margin-top:14px;}   /* 電腦版：和上面的鍵隔開一點，避免誤觸 */
.stickzone{display:none;position:fixed;left:0;right:0;bottom:0;height:44vh;z-index:5;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.stick{-webkit-touch-callout:none;}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud hud-left" aria-live="polite">
  <div class="clock" id="clock">06:00</div>
  <div class="mission" id="mission">聽無線電，找到發出求救訊號的登山客</div>
  <div class="row" id="radioRow"><span class="lbl">無線電</span><span class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></span><span id="radioTxt"></span></div>
  <div class="row" id="passRow" hidden><span class="lbl">乘客狀況</span><span class="meter"><b id="comfortFill"></b></span><strong id="comfortNum">100</strong></div>
  <button class="mobonly" id="menuBtn" aria-label="選單">⋯</button>
  <div class="menuwrap" id="menuWrap">
  <div class="row diffrow" id="diffRow"><span class="lbl">難度</span><span class="seg"><button id="diff_easy">簡單</button><button id="diff_normal">普通</button><button id="diff_hard">困難</button></span></div>

<script>

var VAL_DIST=[200,300];   // 河谷：傷者離小鎮直線幾公尺（Lu 2026-10-13：原本 150～240 太近）
var HILL_DIST=[200,350],HILL_EXTRA=10,HILL_WALLS=30;   // 丘陵：傷者離小鎮直線幾公尺（其他任務用 START_DIST）；主谷、死路谷以外，另外在整張圖散幾條谷、幾道牆（遠處也有地形）

  town:{name:'路面',color:0x9c8f82},
  dirt:{name:'土路',color:0xb08052},
  grass:{name:'草地',color:0x7f9a4c},
  gravel:{name:'岩地',color:0x9aa1ab},
  rock:{name:'岩地',color:0x80869a},
  sand:{name:'沙地',color:0xeccb78},
  mud:{name:'泥地',color:0x4a3222},

var MODE_OF={gravel:'rock',rock:'rock',sand:'sand',mud:'mud',water:'river'};   // 沒列出的（草地、土路、路面）＝不選模式

  var cliffMask=null,roadM=new Uint8Array(N*N),tiltA=null,cnxA=null,cnzA=null,roadPts=[],cps=[],cliffSurf=null;

  // 座標：公尺。起點 s、目標 t，u＝起點→目標的單位向量，v＝垂直方向（山稜和溪溝沿著 v 延伸）
  var sx=2.5*TILE-HALF,sz=sx,tx=(ti+0.5)*TILE-HALF,tz=(tj+0.5)*TILE-HALF,DD=Math.hypot(tx-sx,tz-sz);

      var ex0,ez0,etr=0;do{ex0=(R()*0.9+0.05)*MAP_M-HALF;ez0=(R()*0.9+0.05)*MAP_M-HALF;etr++;}while(Math.hypot(ex0-sx,ez0-sz)<15*TILE&&etr<50);

var LM_NAMES=['tower','bigTree','hut','logs','windmill','whiteRock','lookout','tent'];
function buildLandmarks(){
  landmarks=[];
  var tp=W.targetPos,rnd=mulberry32(W.seed^0x5bd1),used=[],lmS=BIG?2:1,rs=BIG?1:0.25;   // 大地圖地標放大 2 倍；小地圖距離縮成 1/4
  function okSpot(x,z,gap){
    var ti=tileOf(x,z);if(ti<0||W.surf[ti]==='water'||W.solid[ti]||inTown(Math.floor(ti/N),ti%N))return false;
    return !used.some(function(u){return Math.hypot(u[0]-x,u[1]-z)<gap;});
  }
  function put(name,x,z){
    var g=new THREE.Group();LANDMARK[name](g);g.scale.setScalar(lmS);
    g.position.set(x,groundH(x,z),z);g.rotation.y=rnd()*Math.PI*2;
    worldGroup.add(g);landmarks.push(g);used.push([x,z]);
  }
  // 一組地標：每個東西在中心 rmin～rmax 公尺外，候選點裡挑地勢最高的（從低窪裡抬頭看得到）
  function cluster(parts,cx,cz,rmin,rmax){
    parts.forEach(function(name){
      var best=null,bh=-1e9;
      for(var tr=0;tr<24;tr++){
        var ang=rnd()*Math.PI*2,r=(rmin+rnd()*(rmax-rmin))*rs,qx=cx+Math.cos(ang)*r,qz=cz+Math.sin(ang)*r;
        if(!okSpot(qx,qz,8*lmS*rs+2))continue;
        var h=groundH(qx,qz);if(h>bh){bh=h;best=[qx,qz];}
      }
      if(best)put(name,best[0],best[1]);
    });
  }
  // 部分符合的描述：mode 0 少最後一樣、1 最後一樣換成別的、2 第一樣換掉
  function variant(parts,mode){
    var other=LM_NAMES.filter(function(n){return parts.indexOf(n)<0;}),pick=other[Math.floor(rnd()*other.length)];
    if(mode===0)return parts.slice(0,-1);
    if(mode===1)return parts.slice(0,-1).concat([pick]);
    return [pick].concat(parts.slice(1));
  }
  cluster(W.scenario.parts,tp.x,tp.z,30,80);   // 要找的那組：目標旁邊不放，離目標 30～80 m
  // 近距離干擾：離目標 60～100 公尺，只有聽清楚完整描述才分得出來
  for(var n=0;n<DP.nearDecoys;n++){
    for(var tr=0;tr<40;tr++){
      var ang=rnd()*Math.PI*2,r=(60+rnd()*40)*rs,cx=tp.x+Math.cos(ang)*r,cz=tp.z+Math.sin(ang)*r;
      if(!okSpot(cx,cz,10))continue;
      cluster(variant(W.scenario.parts,n%3),cx,cz,20,50);break;
    }
  }
  // 散落各處：面積每 80×80 公尺一組。簡單版單獨一件；其他難度一半是部分符合的組合
  var decoys=Math.round(MAP_M*MAP_M/6400);
  for(n=0;n<decoys;n++){
    for(tr=0;tr<20;tr++){
      var qx=(rnd()-0.5)*(MAP_M-20),qz=(rnd()-0.5)*(MAP_M-20);
      if(Math.hypot(qx-tp.x,qz-tp.z)<40*rs||!okSpot(qx,qz,6))continue;
      if(DP.partialDecoys&&rnd()<0.5){var sc=SCENARIOS[Math.floor(rnd()*SCENARIOS.length)];cluster(variant(sc.parts,Math.floor(rnd()*3)),qx,qz,15,40);}
      else put(LM_NAMES[Math.floor(rnd()*LM_NAMES.length)],qx,qz);
      break;
    }
  }
}

// 絞盤：按住才收線、放開就停止並解除。河裡卡住、或不是懸崖路而附近有樹／大石頭 → 照舊用錨點；
// 其他情況（例如卡在路邊斜坡、輪子懸空）→ 拉向「最近 8 秒內最後一個在路面中央、沒懸空的位置」，收線時不會被懸空／掉崖判定打斷，車頭也慢慢轉回路的方向
var WINCH_PULL={speed:1.2,turn:0.8,memory:8,hold:0.4};
// 絞盤（所有地圖統一，Lu 2026-10-13）：按住＝收線；按住時 WASD／搖桿指一個方向（以畫面為準），勾那個方向上的樹或大石頭（WINCH_A.range 公尺內、前後左右都可以）。
// 沒指方向＝勾最近的。收線時車被直接拉向錨點（不用油門），車頭慢慢轉向錨點（錨點在後面就倒著拉）；台階上限照舊多 LS 層，樹和石頭照樣擋
var WINCH_A={range:30,min:3.4,speed:0.9,turn:1.0,aim:0.3};   // aim：選好方向後停多久才開始收線（秒）
function anchorCands(){
  var c=[];function add(x,z,y){var d=Math.hypot(x-car.x,z-car.z);if(d>=WINCH_A.min&&d<=WINCH_A.range)c.push({x:x,z:z,y:y,d:d});}
  W.trees.forEach(function(t){add(t.x,t.z,t.y);});W.rocks.forEach(function(r){add(r.x,r.z,groundH(r.x,r.z)+0.8);});(W.clAnchors||[]).forEach(function(a){add(a.x,a.z,groundH(a.cx,a.cz)+0.8);});return c;
}
var winchDrag=null;   // 手機：按住絞盤鈕往哪拖（畫面方向，右＋、上＋；沒拖＝null）
var winchAimDbg=null;   // 除錯：直接指定世界方向
function winchDir(){   // 現在指的方向（世界座標的單位向量；沒指＝null）。畫面上＝鏡頭前方，右＝鏡頭右邊
  if(winchAimDbg)return winchAimDbg;
  var ix=0,iy=0;if(winchDrag){ix=winchDrag[0];iy=winchDrag[1];}else if(stick.on){ix=stick.x;iy=stick.y;}else{ix=(keys.right?1:0)-(keys.left?1:0);iy=(keys.gas?1:0)-(keys.brake?1:0);}
  var l=Math.hypot(ix,iy);if(l<0.3)return null;ix/=l;iy/=l;
  var fx=Math.sin(camHd),fz=Math.cos(camHd),rx=-Math.cos(camHd),rz=Math.sin(camHd);
  return [fx*iy+rx*ix,fz*iy+rz*ix];
}
function cliffPullOK(x,z,th){   // 懸崖路收線：輪子沒有進到山壁格（比路面高很多的非路格）就可以拉
  var ws2=wheelWorld(x,z,th);for(var k=0;k<4;k++){var t=tileOf(ws2[k][0],ws2[k][1]);if(t<0)return false;if(!W.roadTile[t]&&W.level[t]>W.L0+W.limUp)return false;if(blocked(ws2[k][0],ws2[k][1],0.35))return false;}
  return true;
}
function pickAnchor(dir){
  var c=anchorCands(),best=null,bs=1e9;
  c.forEach(function(a){var sc;
    if(dir){var cs=((a.x-car.x)*dir[0]+(a.z-car.z)*dir[1])/a.d;if(cs<0.55)return;sc=(1-cs)*3+a.d/WINCH_A.range;}   // 指的方向 ±57° 內，越正、越近越好
    else sc=a.d;
    if(sc<bs){bs=sc;best=a;}});
  return best;
}

(function(){
  var zone=$('stickZone'),base=$('stick'),knob=$('knob'),R=50,ox=0,oy=0,activeId=null,kind=null;   // kind：'p'＝Pointer Events、't'＝Touch Events（哪一種先到就用哪一種，另一種忽略）
  function move(x,y){
    var dx=x-ox,dy=y-oy,m=Math.hypot(dx,dy);
    if(m>R){dx*=R/m;dy*=R/m;}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
    var nx=dx/R,ny=-dy/R;stick.x=Math.abs(nx)<0.12?0:nx;stick.y=Math.abs(ny)<0.12?0:ny;stick.on=true;
  }
  // 浮動搖桿：下半部任何地方按下，搖桿出現在那裡；放開回到中下的淡淡提示圈
  function start(x,y){
    ox=clamp(x,72,innerWidth-72);oy=clamp(y,innerHeight*0.56+40,innerHeight-60);
    base.style.left=(ox-68)+'px';base.style.top=(oy-68)+'px';base.style.right='auto';base.style.bottom='auto';base.style.marginLeft='0';base.classList.add('active');
    move(x,y);
  }
  function end(){activeId=null;kind=null;stick.on=false;stick.x=stick.y=0;knob.style.transform='';
    base.style.left=base.style.top=base.style.right=base.style.bottom=base.style.marginLeft='';base.classList.remove('active');}
  // Pointer Events
  zone.addEventListener('pointerdown',function(e){
    if(activeId!==null)return;kind='p';activeId=e.pointerId;
    try{zone.setPointerCapture(e.pointerId);}catch(err){}
    start(e.clientX,e.clientY);e.preventDefault();
  },{passive:false});
  window.addEventListener('pointermove',function(e){if(kind==='p'&&e.pointerId===activeId){move(e.clientX,e.clientY);e.preventDefault();}},{passive:false});
  ['pointerup','pointercancel'].forEach(function(ev){window.addEventListener(ev,function(e){if(kind==='p'&&e.pointerId===activeId)end();});});
  // Touch Events 備援（iOS WKWebView 偶爾不送 Pointer Events）
  zone.addEventListener('touchstart',function(e){
    e.preventDefault();if(activeId!==null)return;
    var t=e.changedTouches[0];kind='t';activeId=t.identifier;start(t.clientX,t.clientY);
  },{passive:false});
  window.addEventListener('touchmove',function(e){
    if(kind!=='t')return;
    for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===activeId){move(e.changedTouches[i].clientX,e.changedTouches[i].clientY);}
    e.preventDefault();
  },{passive:false});
  ['touchend','touchcancel'].forEach(function(ev){window.addEventListener(ev,function(e){
    if(kind!=='t')return;
    for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===activeId){end();return;}
  },{passive:false});});
  // iOS 的雙指縮放整頁手勢不要搶走遊戲
  ['gesturestart','gesturechange'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});
  // 不常用的功能鍵（絞盤、轉視角、拖車）收進「⋯」選單，常用的四顆留在搖桿上方，同一隻手按得到
})();

var audio=null,radioVol=0.6;   // 無線電音量 0～1，預設 60%
function startAudio(){
  try{var A=new (window.AudioContext||window.webkitAudioContext)();var o=A.createOscillator(),o2=A.createOscillator(),f=A.createBiquadFilter(),g=A.createGain();
    o.type='sawtooth';o2.type='square';o.frequency.value=42;o2.frequency.value=21;f.type='lowpass';f.frequency.value=260;g.gain.value=0;   // 從怠速的低音開始、音量 0（原本是預設 440 Hz，在選單畫面就一直「嘟——」）；出發後才淡入
    o.connect(f);o2.connect(f);f.connect(g);g.connect(A.destination);o.start();o2.start();audio={A:A,o:o,o2:o2,f:f,g:g};
    // 無線電雜訊：白噪音 → 帶通濾波 → 音量（訊號越弱越大聲）
    var len=A.sampleRate*2,buf=A.createBuffer(1,len,A.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var ns=A.createBufferSource();ns.buffer=buf;ns.loop=true;
    var nf=A.createBiquadFilter(),ng=A.createGain();nf.type='bandpass';nf.frequency.value=1800;nf.Q.value=0.5;ng.gain.value=RADIO.noiseMax;
    var rg=A.createGain();rg.gain.value=radioVol;rg.connect(A.destination);   // 無線電總音量（滑桿）；上車後整個關掉
    ng.gain.value=0;ns.connect(nf);nf.connect(ng);ng.connect(rg);ns.start();
    audio.nf=nf;audio.ng=ng;audio.rg=rg;audio.nbuf=buf;}catch(e){audio=null;}
}

var blockMsgT=0,spinT=0,modeHintT=0,tiltHintT=0,tipT2=0,safeT=0,histT=0,rollWarnT=0;
// 點 (x,z)（半徑 pr）有沒有碰到房子或樹、岩石、倒木的實際形狀
function blocked(x,z,pr){
  var t=tileOf(x,z);if(t<0)return false;
  if(W.hard[t])return true;
  var L=W.obst[t];if(!L)return false;
  for(var n=0;n<L.length;n++){
    var o=L[n],dx=x-o.x,dz=z-o.z,rr=o.r+pr;
    if(o.seg){var sx=o.x2-o.x,sz=o.z2-o.z,u=clamp((dx*sx+dz*sz)/(sx*sx+sz*sz),0,1);dx-=sx*u;dz-=sz*u;}
    if(dx*dx+dz*dz<rr*rr)return true;
  }
  return false;
}
function check(nx,nz,nth,limit,st){

      else if(t>=nextDec){
        nextDec=t+4;var th0=car.th,best=-1,bh=th0;
        for(var k=0;k<16;k++){car.th=th0+k*Math.PI/8;radioMeasure();if(RS.sig>best){best=RS.sig;bh=car.th;}}
        car.th=th0;radioMeasure();
        if(best<0.05){if(Math.hypot(wp[0]-car.x,wp[1]-car.z)<25)wp=rnd();aim=wp;}
        else{var r=best>0.6?25:45;aim=[car.x+Math.sin(bh)*r,car.z+Math.cos(bh)*r];}
        pathT=-9;
      }
      if(t-pathT>=2){path=botPath(aim[0],aim[1]);pathT=t;}
      while(path.length>1&&Math.hypot(path[0][0]-car.x,path[0][1]-car.z)<5)path.shift();
      var tgt;
      if(W.cl&&kind==='omni'){   // 懸崖路：沿著路中心線往前看 6 m
        var cpts=W.cl.pts,bd5=1e9,bk5=clI;
        for(var q5=clI;q5<Math.min(cpts.length,clI+40);q5++){var d5=Math.hypot(cpts[q5][0]-car.x,cpts[q5][1]-car.z);if(d5<bd5){bd5=d5;bk5=q5;}}
        clI=bk5;var la5=Math.min(cpts.length-1,clI+6);tgt=[cpts[la5][0],cpts[la5][1]];
      }else tgt=path.length>1?path[W.type==='cliff'?0:Math.min(1,path.length-1)]:aim;   // 懸崖路：對準下一格的中心，不抄近路
      if(d<12)tgt=[tp.x,tp.z];
      var e=wrap(Math.atan2(tgt[0]-car.x,tgt[1]-car.z)-car.th);
      if(t<escT)e=wrap(escHd-car.th);   // 剛脫困：先朝別的方向開一下
      if(Math.abs(e)>1.5&&Math.abs(car.v)<3.5){keys.gas=false;keys.brake=true;keys.left=e<0;keys.right=e>0;}
      else{keys.brake=false;keys.gas=true;keys.left=e>0.1;keys.right=e<-0.1;
        if(d<9||(kind!=='omni'&&sig>0.9)){keys.gas=car.v<2.5;keys.brake=car.v>3.5;}}
      if(t-stuckT>=3){var mv=Math.hypot(car.x-lx,car.z-lz);lx=car.x;lz=car.z;stuckT=t;if(mv<1.5){bmode='rev';m=1.6;rdir=BR()<0.5?1:-1;stucks++;}}
    }else{keys.gas=false;keys.brake=true;keys.left=rdir>0;keys.right=rdir<=0;m-=dt;if(m<=0){bmode='go';pathT=-9;lx=car.x;lz=car.z;stuckT=t;escT=t+2.5;escHd=car.th+rdir*(0.9+BR()*0.7);}}
    step(dt);t+=dt;
  }
  keys.gas=keys.brake=keys.left=keys.right=false;
  return {t:Math.round(t),found:t<maxT,first:first===null?null:Math.round(first),stucks:stucks};
}

// ---------- 除錯：地形比例（整張圖、機器人路徑、起點到傷者的直線各一份）----------
function measureTerrain(diff,n){
  var CAT={grass:'草',dirt:'草',town:'草',rock:'岩',gravel:'岩',sand:'沙',mud:'泥',water:'河'};
  function z(){return {草:0,岩:0,沙:0,泥:0,河:0};}
  setDifficulty(diff);var area=z(),path=z(),line=z(),hitP={沙:0,泥:0,河:0},hitL={沙:0,泥:0,河:0},tot=0,ptot=0,ltot=0,tries=0;
  for(var k=0;k<n;k++){
    newMission();tries+=W.reachTries;var tp=W.targetPos,i,j,q;
    for(i=0;i<N;i++)for(j=0;j<N;j++){if(i<4&&j<4)continue;area[CAT[W.surf[i*N+j]]]++;tot++;}
    var p=botPath(tp.x,tp.z),sp={};
    p.forEach(function(c){var t=Math.floor((c[0]+HALF)/TILE)*N+Math.floor((c[1]+HALF)/TILE),ct=CAT[W.surf[t]];path[ct]++;ptot++;sp[ct]=1;});
    for(q in hitP)if(sp[q])hitP[q]++;
    var dx=tp.x-car.x,dz=tp.z-car.z,d=Math.hypot(dx,dz),sl={};
    for(var s2=0;s2<=d;s2+=2){var t2=tileOf(car.x+dx*s2/d,car.z+dz*s2/d),ct2=CAT[W.surf[t2]];line[ct2]++;ltot++;sl[ct2]=1;}
    for(q in hitL)if(sl[q])hitL[q]++;
  }
  function pc(o,t){var r={};for(var key in o)r[key]=Math.round(100*o[key]/t)+'%';return r;}
  return {area:pc(area,tot),path:pc(path,ptot),line:pc(line,ltot),pathHasEach:hitP,lineHasEach:hitL,reachTriesAvg:+(tries/n).toFixed(1),of:n};
}
